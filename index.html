<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit 19 – Từ vựng chuẩn bị bài</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF4FB;--surface:#fff;--ink:#0B3954;--muted:#4F6D7F;--line:#C9DEEC;--accent:#1F6FEB;--accent-ink:#fff;--good:#1E9E4A;--bad:#D6403A;--sun:#FFC93C;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1A26;--surface:#12293A;--ink:#E6F2FA;--muted:#9DB7C8;--line:#23435A;--accent:#6FB1FF;--accent-ink:#06223a;--good:#4CD07D;--bad:#FF7A73;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1A26;--surface:#12293A;--ink:#E6F2FA;--muted:#9DB7C8;--line:#23435A;--accent:#6FB1FF;--accent-ink:#06223a;--good:#4CD07D;--bad:#FF7A73;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Be Vietnam Pro",system-ui,sans-serif}
h1,h2,h3{font-family:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;line-height:1.15;margin:0}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;justify-content:space-between;margin-bottom:14px}
header h1{font-size:clamp(26px,5vw,38px);font-weight:800}
header p{margin:2px 0 0;color:var(--muted)}
.who{font-size:14px;color:var(--muted)}
.who b{color:var(--ink)}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;border-bottom:2px solid var(--line);margin-bottom:20px}
nav button{flex:none;border:0;background:transparent;color:var(--muted);font:600 15px "Be Vietnam Pro",sans-serif;padding:9px 14px;border-radius:999px;cursor:pointer}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sub{color:var(--muted);margin:4px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:color-mix(in srgb,var(--tone,#9ec5e8) 24%,var(--surface));border:2px solid color-mix(in srgb,var(--tone,#9ec5e8) 55%,var(--line));border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:2px}
.card .pic{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin-bottom:8px;background:var(--line)}
.card .en{font:800 22px "Baloo 2",sans-serif}
.card .vi{font-weight:600}
.card .ex{font-size:14px;color:var(--muted);margin-top:6px}
.card .ex i{display:block;font-style:normal;font-size:13px;opacity:.85}
.say{align-self:flex-start;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;margin-top:6px}
.box{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 16px}
.box b{font-family:"Baloo 2",sans-serif;font-size:18px}
.pat{background:var(--surface);border:3px solid var(--accent);border-radius:20px;padding:16px 18px 18px;margin:0 0 20px;box-shadow:6px 6px 0 var(--accent)}
.pat h3{font-size:20px;margin-bottom:10px}
.pat .f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:800 24px "Baloo 2",sans-serif}
.pat .f span{background:var(--accent);color:var(--accent-ink);padding:4px 14px;border-radius:12px}
.pat .f em{font-style:normal;color:var(--muted)}
.pat .qa{margin-top:14px;display:grid;gap:6px;font-size:17px}
.pat .qa b{color:var(--accent)}
.pat .use{margin:12px 0 0;color:var(--muted);font-size:14.5px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:600 16px "Be Vietnam Pro",sans-serif;padding:11px 20px;border-radius:12px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.qlist{display:grid;gap:12px}
.qrow{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.qrow .n{font:800 30px "Baloo 2",sans-serif;color:var(--accent);width:34px}
.qrow .t{flex:1}.qrow .t small{display:block;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:6px 0 20px}
.bar i{display:block;height:100%;background:var(--accent)}
.prompt{font:800 26px "Baloo 2",sans-serif;margin:6px 0 14px}
.bigpic{display:block;width:100%;max-width:440px;aspect-ratio:4/3;object-fit:cover;border-radius:16px;margin:10px auto 16px;background:var(--line)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:13px 14px;font:600 17px "Be Vietnam Pro",sans-serif;text-align:left;cursor:pointer}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 20%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--surface))}
.opt:disabled{cursor:default}
.pattern{font:800 38px "Baloo 2",sans-serif;letter-spacing:.14em;text-align:center;margin:6px 0 12px}
input.ans{width:100%;font:600 20px "Be Vietnam Pro",sans-serif;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600}
.fb.ok{background:color-mix(in srgb,var(--good) 20%,var(--surface))}
.fb.no{background:color-mix(in srgb,var(--bad) 18%,var(--surface))}
.hint{margin-top:10px;color:var(--muted);font-style:italic}
.score{font:800 64px "Baloo 2",sans-serif;text-align:center;line-height:1}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto;background:var(--surface);border:2px solid var(--line);border-radius:14px}
.note{font-size:13.5px;color:var(--muted);margin-top:10px}
.warn{background:color-mix(in srgb,var(--sun) 30%,var(--surface));border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
tr.stu{cursor:pointer}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}

.sayrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.sayrow .say{margin-top:0}
</style>
</head>

let curAudio=null;
function tts(t){try{
 const vs=speechSynthesis.getVoices().filter(v=>/^en[-_](US|GB)/i.test(v.lang));
 const best=vs.find(v=>/(Samantha|Google US|Google UK|Aria|Jenny|Natural|Daniel|Karen)/i.test(v.name))||vs[0];
 const u=new SpeechSynthesisUtterance(t.replace(/Z’s/g,"Zees"));u.lang="en-US";if(best)u.voice=best;u.rate=.85;
 speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function speak(t){
 try{if(curAudio){curAudio.pause();curAudio=null}}catch(e){}
 const src=AUD[t];
 if(src){try{curAudio=new Audio(src);const p=curAudio.play();if(p&&p.catch)p.catch(()=>tts(t));return}catch(e){}}
 tts(t);
}

function persist(){lsSet("u19:name",S.name);lsSet("u19:sessions",S.sessions)}
const formReady=()=>/^https:\/\/script\.google\.com\//.test(CONFIG.SHEET_URL);
function line(r){return [r.name||S.name,"Bài "+r.q,r.correct+"/"+r.total,"gợi ý "+r.hints,fmt(r.t)].join(" | ")}
async function send(r){
 const b=new URLSearchParams();
 b.append("id",r.id);b.append("name",r.name);b.append("quiz","Bài "+r.q+" - "+r.title);b.append("score",r.correct+"/"+r.total);b.append("hints",String(r.hints));
 b.append("status",r.partial?"Dở dang (đã làm "+r.answered+"/"+r.total+" câu)":"Hoàn thành");
 await fetch(CONFIG.SHEET_URL,{method:"POST",mode:"no-cors",body:b});
}
let pchain=Promise.resolve();
function sendProgress(r){if(formReady())pchain=pchain.then(()=>send(r)).catch(()=>{})}
let sending=false;
async function flush(){
 if(!formReady()||sending)return;
 const un=lsGet("u19:unsent",[]);if(!un.length)return;
 sending=true;const left=[];
 for(const r of un){try{await send(r)}catch(e){left.push(r)}}
 sending=false;lsSet("u19:unsent",left);S.status=left.length?"err":"ok";render();
}
function submit(r){
 r.name=S.name;persist();
 if(formReady()){const un=lsGet("u19:unsent",[]);un.push(r);lsSet("u19:unsent",un);S.status="local";flush()}
}

function init(){S.name=lsGet("u19:name","");S.sessions=lsGet("u19:sessions",[]);S.status="local";render();flush()}

function nav(){
 const tabs=[["w","1 · Thời tiết"],["a","2 · Hoạt động"],["q","Bài tập"],["h","Kết quả của em"]];
 if(S.teacher)tabs.push(["t","Giáo viên"]);
 $("#nav").innerHTML=tabs.map(([k,l])=>`<button data-t="${k}" aria-current="${S.tab===k&&!S.quiz}">${l}</button>`).join("");
 $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.quiz=null;render()});
 $("#who").innerHTML=S.name?`Học sinh: <b>${esc(S.name)}</b> · <a href="#" id="chg" style="color:inherit">đổi tên</a>`:"";
 const c=$("#chg");if(c)c.onclick=e=>{e.preventDefault();S.name="";persist();render()};
}

function pat(title,formula,lines,use){
 return `<div class="pat"><h3>${title}</h3><div class="f">${formula.map(p=>p.startsWith("+")?`<em>+</em>`:`<span>${p}</span>`).join("")}</div><div class="qa">${lines.map(l=>`<div>${l}</div>`).join("")}</div>${use?`<p class="use">${use}</p>`:""}</div>`;
}
function vocabCards(list){
 return `<div class="grid">${list.map((x,i)=>`<div class="card" style="--tone:${x.t}"><img class="pic" src="${x.img}" alt="${esc(x.en)}"><div class="en">${x.en}</div><div class="vi">${x.vi}</div><div class="ex">${x.s}<i>${x.sv}</i></div><div class="sayrow"><button class="say" data-say="${esc(x.en)}" aria-label="Nghe ${esc(x.en)}">🔊 Nghe</button><button class="say" data-say="${esc(x.s)}" aria-label="Nghe câu ví dụ">🔊 Câu</button></div></div>`).join("")}</div>`;
}

function render(){
 nav();const m=$("#main");
 if(!S.name){
  m.innerHTML=`<div class="box"><h2>Em tên là gì?</h2><p class="sub">Nhập họ tên để cô lưu kết quả bài làm của em.</p><input class="ans" id="nm" maxlength="60" placeholder="Ví dụ: Nguyễn Minh Anh" autocomplete="name"><div class="row"><button class="btn" id="go">Bắt đầu học</button></div></div>`;
  const go=()=>{const v=$("#nm").value.trim();if(!v){$("#nm").focus();return}S.name=v;persist();render()};
  $("#go").onclick=go;$("#nm").onkeydown=e=>{if(e.key==="Enter")go()};return;
 }
 if(S.quiz)return renderQuiz(m);
 if(S.tab==="w"){
  m.innerHTML=`<h2>Từ vựng: Thời tiết</h2><p class="sub">Bấm 🔊 để nghe và đọc theo.</p>${pat("Mẫu câu: hỏi và nói về thời tiết",["It’s","+","weather","+","and","+","weather"],["Hỏi: <b>How’s the weather today?</b>","Đáp: <b>It’s sunny and windy.</b> / <b>It’s raining and stormy.</b>"],"Weather = một trong các từ ở bên dưới.")}${vocabCards(W)}<div class="row"><button class="btn" id="nx">Sang phần Hoạt động</button></div>`;
  $("#nx").onclick=()=>{S.tab="a";render();scrollTo(0,0)};
 }else if(S.tab==="a"){
  m.innerHTML=`<h2>Từ vựng: Hoạt động</h2><p class="sub">Dùng cho kế hoạch tương lai với <b>be going to</b>.</p>${pat("Cấu trúc: be going to (kế hoạch tương lai)",["S","+","am / is / are","+","going to","+","V"],["I <b>am going to</b> study. · She <b>is going to</b> cook.","Hỏi: <b>What are you going to do this weekend?</b>","Đáp: <b>I’m going to</b> go camping <b>because</b> it’s going to be sunny."],"Dùng để nói về việc mình đã dự định sẽ làm. Sau <b>going to</b> luôn là động từ nguyên mẫu.")}${vocabCards(A)}<div class="row"><button class="btn" id="nx">Làm bài tập</button></div>`;
  $("#nx").onclick=()=>{S.tab="q";render();scrollTo(0,0)};
 }else if(S.tab==="q"){
  const notice=S.canWrite===false?`<div class="warn">Em đang ở chế độ chỉ xem nên kết quả chưa lưu được lên hệ thống. Nhờ cô cấp quyền “Contributor”.</div>`:"";
  m.innerHTML=`<h2>Bài tập</h2><p class="sub">Mỗi bài có ${NQ} câu. Làm bao nhiêu lần cũng được, mỗi lần đều được lưu.</p>${notice}<div class="qlist">${QZ.map(q=>{const h=S.sessions.filter(s=>s.q===q.n);const best=h.reduce((a,s)=>Math.max(a,s.correct),0);return `<div class="qrow"><div class="n">${q.n}</div><div class="t"><b>${q.title}</b><small>${q.sub}</small><small>${h.length?`Đã làm ${h.length} lần · cao nhất ${best}/${NQ}`:"Chưa làm"}</small></div><button class="btn" data-q="${q.n}">Làm bài</button></div>`}).join("")}</div>`;
  m.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>startQuiz(+b.dataset.q));
 }else if(S.tab==="h"){
  const rows=S.sessions.slice().reverse();
  m.innerHTML=`<h2>Kết quả của em</h2><p class="sub">${statusText()}</p>${rows.length?`<div class="scroll"><table><tr><th>Thời gian</th><th>Bài</th><th>Đúng</th></tr>${rows.map(s=>`<tr><td>${fmt(s.t)}</td><td>${s.q}. ${esc(s.title)}</td><td><b>${s.correct}/${s.total}</b></td></tr>`).join("")}</table></div>`:`<div class="box">Em chưa làm bài nào.</div>`}`;
 }else if(S.tab==="t"){
  teacherView(m);
 }
 m.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
}
function statusText(){return !formReady()?"Kết quả lưu trên máy này.":S.status==="ok"?"Đã gửi kết quả cho cô giáo.":S.status==="err"?"Chưa gửi được (kiểm tra mạng). Kết quả vẫn lưu trên máy và sẽ tự gửi lại lần sau.":"Đang gửi kết quả cho cô giáo…"}

function teacherView(m){
 if(!S.db){m.innerHTML=`<div class="box">Chưa kết nối được dữ liệu chung. Hãy mở trang từ liên kết đã đăng.</div>`;return}
 const list=S.all.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"","vi"));
 const cell=(ss,n)=>{const h=(ss||[]).filter(s=>s.q===n);if(!h.length)return "–";const last=h[h.length-1].correct,best=Math.max(...h.map(s=>s.correct));return `${last}/${NQ} <small style="color:var(--muted)">(cao nhất ${best})</small>`};
 m.innerHTML=`<h2>Kết quả cả lớp</h2><p class="sub">Cập nhật trực tiếp. Mỗi ô: lần làm gần nhất (điểm cao nhất). Bấm vào tên để xem toàn bộ lịch sử.</p>${list.length?`<div class="scroll"><table><tr><th>Học sinh</th><th>Số lượt</th>${QZ.map(q=>`<th>Bài ${q.n}</th>`).join("")}</tr>${list.map(r=>`<tr class="stu" data-id="${esc(r.id)}"><td><b>${esc(r.name||"(chưa có tên)")}</b></td><td>${(r.sessions||[]).length}</td>${QZ.map(q=>`<td>${cell(r.sessions,q.n)}</td>`).join("")}</tr>${S.open===r.id?`<tr><td colspan="${QZ.length+2}">${(r.sessions||[]).slice().reverse().map(s=>`${fmt(s.t)} · Bài ${s.q}: <b>${s.correct}/${s.total}</b>${s.hints?` · dùng gợi ý ${s.hints} lần`:""}`).join("<br>")||"Chưa có lượt nào."}</td></tr>`:""}`).join("")}</table></div>`:`<div class="box">Chưa có học sinh nào làm bài.</div>`}`;
 m.querySelectorAll("tr.stu").forEach(r=>r.onclick=()=>{S.open=S.open===r.dataset.id?null:r.dataset.id;render()});
}

function startQuiz(n){
 const q=QZ.find(x=>x.n===n);
 const items=shuf(q.pool).slice(0,NQ).map(x=>({x,opts:q.kind==="type"?null:shuf([x,...shuf(q.pool.filter(y=>y!==x)).slice(0,3)])}));
 S.quiz={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),q,items,i:0,correct:0,hints:0,done:false,res:null,hint:false,fin:false};render();scrollTo(0,0);
}

function renderQuiz(m){
 const Q=S.quiz,q=Q.q;
 if(Q.fin){
  const msg=Q.correct===NQ?"Tuyệt vời! Em nhớ hết rồi.":Q.correct>=NQ-2?"Rất tốt! Ôn lại vài từ nữa là chắc.":"Cố lên! Quay lại xem từ vựng rồi làm lại nhé.";
  m.innerHTML=`<div class="box"><h2>Bài ${q.n}: ${q.title}</h2><div class="score">${Q.correct}/${NQ}</div><p style="text-align:center;font-weight:600">${msg}</p><p class="note" style="text-align:center">${statusText()}</p>${formReady()?"":`<div class="box" style="margin-top:14px"><div class="note">Gửi dòng này cho cô giáo:</div><b>${esc(line(S.sessions[S.sessions.length-1]))}</b><div class="row"><button class="btn ghost" id="cp">Copy</button></div></div>`}<div class="row" style="justify-content:center"><button class="btn" id="again">Làm lại</button><button class="btn ghost" id="back">Về danh sách bài tập</button></div></div>`;
  const cp=$("#cp");if(cp)cp.onclick=()=>{try{navigator.clipboard.writeText(line(S.sessions[S.sessions.length-1]));cp.textContent="Đã copy"}catch(e){}};$("#again").onclick=()=>startQuiz(q.n);$("#back").onclick=()=>{S.quiz=null;S.tab="q";render()};return;
 }
 const it=Q.items[Q.i],x=it.x;
 let h=`<p class="sub">Bài ${q.n} · ${q.title}</p><div class="bar"><i style="width:${Q.i/NQ*100}%"></i></div><div class="note" style="margin:-12px 0 10px">Câu ${Q.i+1}/${NQ}</div>`;
 if(q.kind==="pic"){
  h+=`<div class="prompt">Đây là gì? / Em đoán xem</div><img class="bigpic" src="${x.img}" alt="Hình minh họa"><div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}" ${Q.done?"disabled":""}>${o.en}</button>`).join("")}</div>`;
 }else if(q.kind==="type"){
  const pat=x.en.split("").map((c,i)=>i%2===0?c:"_").join(" ");
  h+=`<div class="prompt">“${x.vi}” trong tiếng Anh là gì?</div><div class="pattern" aria-label="gợi ý chữ cái">${pat}</div><input class="ans" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ từ tiếng Anh" ${Q.done?"disabled":""}>${Q.done?"":`<div class="row"><button class="btn" id="chk">Kiểm tra</button><button class="btn ghost" id="hb">Gợi ý thêm</button></div>`}${Q.hint?`<div class="hint">${esc(x.s.replace(new RegExp(x.en,"i"),"_____"))}</div>`:""}`;
 }else{
  h+=`<div class="prompt">${esc(x.cz).replace("___",'<span style="border-bottom:3px solid var(--accent);padding:0 18px"></span>')}</div><div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}" ${Q.done?"disabled":""}>${o.en}</button>`).join("")}</div>${Q.done?"":`<div class="row"><button class="btn ghost" id="hb">Gợi ý tiếng Việt</button></div>`}${Q.hint?`<div class="hint">${esc(x.cv)}</div>`:""}`;
 }
 if(Q.done)h+=`<div class="fb ${Q.res?"ok":"no"}">${Q.res?"Chính xác! ":"Chưa đúng. Đáp án: "}<b>${x.en}</b> = ${x.vi}</div><div class="row"><button class="btn" id="next">${Q.i+1===NQ?"Xem kết quả":"Câu tiếp theo"}</button></div>`;
 m.innerHTML=h;
 const fin=ok=>{Q.done=true;Q.res=ok;if(ok)Q.correct++;sendProgress({id:Q.id,name:S.name,q:q.n,title:q.title,correct:Q.correct,total:NQ,hints:Q.hints,answered:Q.i+1,partial:true});render()};
 m.querySelectorAll(".opt").forEach(b=>{
  if(Q.done){const o=it.opts[+b.dataset.k];if(o===x)b.classList.add("ok");else if(b.dataset.k==Q.sel)b.classList.add("no")}
  else b.onclick=()=>{Q.sel=b.dataset.k;fin(it.opts[+b.dataset.k]===x)};
 });
 const hb=$("#hb");if(hb)hb.onclick=()=>{if(!Q.hint){Q.hint=true;Q.hints++}render()};
 const chk=$("#chk");
 if(chk){const go=()=>fin($("#ans").value.trim().toLowerCase()===x.en);chk.onclick=go;$("#ans").onkeydown=e=>{if(e.key==="Enter")go()};$("#ans").focus()}
 if(Q.done&&$("#ans"))$("#ans").value=x.en;
 const nx=$("#next");
 if(nx)nx.onclick=()=>{
  Q.i++;Q.done=false;Q.res=null;Q.hint=false;Q.sel=null;
  if(Q.i>=NQ){Q.fin=true;const r={id:Q.id,t:new Date().toISOString(),q:q.n,title:q.title,correct:Q.correct,total:NQ,hints:Q.hints,name:S.name};S.sessions.push(r);submit(r)}
  render();scrollTo(0,0);
 };
}
init();
</script>
</body>
</html>
